<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Ana - Fase 5</title>
    <link rel="stylesheet" href="../css/fase5.css"> 
</head>
<body>
    <div class="container">
        <a class="btn-menu" href="InicialGamePage.html">← VOLTAR AO MAPA</a>
        <div class="left-column">
            <div class="story-box">
                Mesmo tendo bloqueado, Ana ainda se sentia chateada. Ela sabia que não devia guardar aquele sentimento só para si.
            </div>
            
            <div class="image-container">
                <!-- Espaço para a imagem PNG da Fase 5 -->
                <div class="image-placeholder">
                    <img src="https://via.placeholder.com/320?text=Imagem+Fase+5" alt="Ana a conversar com os pais" id="ana-image">
                </div>
            </div>

            <div class="interaction-section">
                <h3>Já aconteceu algo parecido com você?</h3>
                <input type="text" placeholder="Sua resposta aqui...">
                <button class="btn-enviar">Enviar</button>
            </div>
        </div>

        <div class="right-column">
            <h2>Quem são as melhores pessoas para pedir ajuda quando algo ruim acontece online?</h2>
            
            <div class="options-container">
                <button class="option-btn" data-correct="false">
                    Opção A: Outros jogadores desconhecidos da internet.
                    <span class="icon"></span>
                </button>
                <!-- A Opção B é a correta nesta fase -->
                <button class="option-btn" data-correct="true">
                    Opção B: Pais, responsáveis ou professores de confiança.
                    <span class="icon"></span>
                </button>
                <button class="option-btn" data-correct="false">
                    Opção C: Ninguém, o melhor é guardar segredo.
                    <span class="icon"></span>
                </button>
            </div>

            <!-- Direciona para a próxima fase (se houver) ou tela final -->
            <a class="btn-proximo disabled" href="fase6.html" aria-disabled="true">PRÓXIMO</a>
        </div>
    </div>
    
    <script src="../js/gameProgress.js"></script>
    <script src="../js/fase5.js"></script>
</body>
</html>
