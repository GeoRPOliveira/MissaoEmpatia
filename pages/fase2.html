<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Ana - Fase 2</title>
    <link rel="stylesheet" href="../css/fase2.css"> 
</head>
<body>
    <div class="container">
        <div class="left-column">
            <div class="story-box">
                Ana fica surpresa com as mensagens. Ela sente vontade de responder, mas percebe que aquilo está deixando-a triste.
            </div>
            
            <div class="image-container">
                <div class="speech-bubble">
                    Por que ele está falando assim comigo?
                </div>
                <!-- Espaço para a imagem PNG da Fase 2 -->
                <div class="image-placeholder">
                    <img src="https://via.placeholder.com/320?text=Imagem+Fase+2" alt="Ana triste com as mensagens" id="ana-image">
                </div>
            </div>

            <div class="interaction-section">
                <h3>Já aconteceu algo parecido com você?</h3>
                <input type="text" placeholder="Sua resposta aqui...">
                <button class="btn-enviar">Enviar</button>
            </div>
        </div>

        <div class="right-column">
            <h2>O que Ana deve fazer quando alguém começa a provocá-la?</h2>
            
            <div class="options-container">
                <button class="option-btn" data-correct="false">
                    Opção A: Responder com xingamentos.
                    <span class="icon"></span>
                </button>
                <button class="option-btn" data-correct="false">
                    Opção B: Continuar discutindo até a pessoa parar.
                    <span class="icon"></span>
                </button>
                <!-- A Opção C é a correta nesta fase -->
                <button class="option-btn" data-correct="true">
                    Opção C: Não revidar e não responder às provocações.
                    <span class="icon"></span>
                </button>
            </div>

            <a href="fase3.html" style="text-decoration: none; display: flex; flex-direction: column;">
                <button class="btn-proximo">PRÓXIMO</button>
            </a>
        </div>
    </div>
    
    <script src="../js/fase2.js"></script>
</body>
</html>
