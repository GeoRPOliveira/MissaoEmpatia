<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Ana - Fase 4</title>
    <link rel="stylesheet" href="../css/fase4.css"> 
</head>
<body>
    <div class="container">
        <div class="left-column">
            <div class="story-box">
                Para não continuar recebendo mensagens ruins e não atrapalhar sua diversão, Ana decide usar as ferramentas do próprio jogo.
            </div>
            
            <div class="image-container">
               
                <!-- Espaço para a imagem PNG da Fase 4 -->
                <div class="image-placeholder">
                    <img src="https://via.placeholder.com/320?text=Imagem+Fase+4" alt="Ana a bloquear o jogador" id="ana-image">
                </div>
            </div>

            <div class="interaction-section">
                <h3>Já aconteceu algo parecido com você?</h3>
                <input type="text" placeholder="Sua resposta aqui...">
                <button class="btn-enviar">Enviar</button>
            </div>
        </div>

        <div class="right-column">
            <h2>O que acontece quando Ana bloqueia o jogador no jogo?</h2>
            
            <div class="options-container">
                <button class="option-btn" data-correct="false">
                    Opção A: O jogador perde a conta dele para sempre.
                    <span class="icon"></span>
                </button>
                <!-- A Opção B é a correta nesta fase -->
                <button class="option-btn" data-correct="true">
                    Opção B: Ana para de receber mensagens dele e se protege de mais ofensas.
                    <span class="icon"></span>
                </button>
                <button class="option-btn" data-correct="false">
                    Opção C: O jogo é cancelado para todo mundo.
                    <span class="icon"></span>
                </button>
            </div>

            <!-- Direciona para a Fase 5 -->
            <a href="fase5.html" style="text-decoration: none; display: flex; flex-direction: column;">
                <button class="btn-proximo">PRÓXIMO</button>
            </a>
        </div>
    </div>
    
    <script src="../js/fase4.js"></script>
</body>
</html>
