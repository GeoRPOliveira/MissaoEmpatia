<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Ana - Fase 3</title>
    <link rel="stylesheet" href="../css/fase3.css"> 
</head>
<body>
    <div class="container">
        <a class="btn-menu" href="InicialGamePage.html">← VOLTAR AO MAPA</a>
        <div class="left-column">
            <div class="story-box">
                Mesmo sem responder, Ana percebe que aquelas mensagens continuam ali. Ela decide guardar o que aconteceu.
            </div>
            
            <div class="image-container">
               
                <!-- Espaço para a imagem PNG da Fase 3 -->
                <div class="image-placeholder">
                    <img src="https://via.placeholder.com/320?text=Imagem+Fase+3" alt="Ana a tirar foto do ecrã" id="ana-image">
                </div>
            </div>

            <div class="interaction-section">
                <h3>Já aconteceu algo parecido com você?</h3>
                <input type="text" placeholder="Sua resposta aqui...">
                <button class="btn-enviar">Enviar</button>
            </div>
        </div>

        <div class="right-column">
            <h2>Por que Ana deve guardar os prints das mensagens?</h2>
            
            <div class="options-container">
                <!-- A Opção A é a correta nesta fase -->
                <button class="option-btn" data-correct="true">
                    Opção A: Para mostrar o que aconteceu caso precise pedir ajuda depois..
                    <span class="icon"></span>
                </button>
                <button class="option-btn" data-correct="false">
                    Opção B: Para postar as mensagens e se vingar.
                    <span class="icon"></span>
                </button>
                <button class="option-btn" data-correct="false">
                    Opção C: Para mandar as mensagens para outras pessoas.
                    <span class="icon"></span>
                </button>
            </div>

            <a class="btn-proximo disabled" href="fase4.html" aria-disabled="true">PRÓXIMO</a>
        </div>
    </div>
    
    <script src="../js/gameProgress.js"></script>
    <script src="../js/fase3.js"></script>
</body>
</html>
